# Catalog entry for hermes-gatekeeper. `sha` is pinned to the reviewed commit at submission.
name: hermes-gatekeeper
title: Gatekeeper
repo: https://github.com/percyhendrux123-prog/hermes-gatekeeper
sha: TBD
subdir: ""
version: "0.1.0"
maintainer: Percy Keith Stewart
tier: community
category: automation
requires_hermes: ">=0.22.5"
platforms: [linux, macos]
readme: true
description: >-
  Gatekeeper enforces rules the owner configures; not legal advice and not a compliance guarantee.
  A deterministic pre_tool_call gate for recognized outbound sends: literal `hermes send` and
  `imsg send` terminal commands (including terminal calls made from execute_code), and a
  send_message call if one ever traverses the hook. Hermes registers no model-callable
  send_message tool, so connector, MCP, cron-delivery, browser and script-based sends are not
  inspected. Rules: absolute suppression, per-channel consent and recipient-local quiet hours
  (block), and native Hermes approval requests for unanswered threads, minimum gaps and
  unapproved wording (the host auto-approves these under --yolo, approvals off and hermes -z).
  Uses the public post_gateway_admission hook to record observed STOP keywords and DM replies
  (excludes control, approval, steering and slash-command traffic). Reads tool arguments,
  results and normalized inbound snapshots; writes only profile-local SQLite (owner-only
  permissions) with recipient/thread hashes, message SHA-256, decision metadata, consent
  source/date, timezone/region and owner template variables. No raw message-body log; hashes
  are not anonymity. No network, subprocess, model calls, telemetry, credential reads, external
  file scans or core patches. Invalid settings or storage errors block recognized sends.
known_issues:
  - "Not an egress firewall: connector/MCP/cron tools, scripts, direct delivery and later argument rewrites are not governed."
  - "The agent-visible send path is the terminal tool; Hermes has no model-callable send_message tool."
  - "approve rules are host-owned: --yolo, approvals.mode off and hermes -z auto-approve them; block rules still apply."
  - "Inbound hook omits control/approval/steering/slash traffic; manually record unseen optouts/replies."
  - "No address-book or alias/group-membership resolution; use stable target identities."
capabilities:
  provides_tools: []
  provides_hooks: [pre_tool_call, post_tool_call, post_gateway_admission]
  provides_middleware: []
  requires_env: []
